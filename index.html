<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee">
<title>Goal OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f3ee;--card:#fffdf9;--ink:#1f2430;--mut:#6f7480;--line:#e6e0d4;--soft:#efe9de;--ok:#2f8f5b;--warn:#b7791f;--acc:#1f2430;--r:18px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#131519;--card:#1c1f25;--ink:#ecebe7;--mut:#9aa0ab;--line:#2c3038;--soft:#252930;--acc:#ecebe7}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:680px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 110px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 2px 16px}
.date{font-size:13px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
h1{font:600 30px/1.1 var(--serif);margin:2px 0 0}
h2{font:600 21px/1.2 var(--serif);margin:26px 2px 10px}
h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:18px 0 6px;font-weight:650}
.hb{display:flex;gap:8px}
.ib{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px;position:relative;display:grid;place-items:center}
.ib.on{background:var(--ink);border-color:var(--ink)}
.ib i{position:absolute;top:-4px;right:-4px;background:#d64545;color:#fff;font:700 11px/18px var(--sans);min-width:18px;height:18px;border-radius:9px;font-style:normal;text-align:center}
.mode{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:flex-start}
.mode b{display:block;font:600 17px var(--serif)}
.mode span{color:var(--mut);font-size:14.5px}
.mode.alt{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--card))}
.ring{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--sans);background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--soft) 0);position:relative}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}.ring em{position:relative;font-style:normal}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden;border-left:5px solid var(--c)}
.row{display:flex;gap:14px;padding:14px 14px 14px 12px;align-items:center}
.tick{flex:none;width:54px;height:54px;border-radius:50%;border:2.5px solid var(--c);font-size:24px;display:grid;place-items:center;transition:.18s transform,.18s background}
.tick:active{transform:scale(.9)}
.done .tick{background:var(--c);color:#fff;font-weight:800}
.skip{opacity:.55}
.bd{flex:1;min-width:0;cursor:pointer}
.nm{display:flex;justify-content:space-between;gap:8px;font-weight:650;font-size:16.5px}
.wk{display:flex;gap:3px;align-items:center}.wk s{width:8px;height:8px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}.wk s.f{background:var(--c);border-color:var(--c)}
.fo{font-size:14.5px;margin-top:1px}.cue{font-size:13px;color:var(--mut);margin-top:2px}
.lv{display:inline-block;margin-top:7px;font-size:13px;background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:8px;padding:3px 8px}
.ex{border-top:1px solid var(--line);padding:6px 16px 16px;font-size:14.5px}
.ex p{margin:6px 0}.ex ul,.ex ol{margin:6px 0;padding-left:20px}.ex li{margin:3px 0}
.plan{border-left:3px solid var(--c);padding:6px 10px;margin:6px 0;background:var(--soft);border-radius:0 10px 10px 0}
.plan b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);display:block}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.b{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14.5px;text-decoration:none;color:var(--ink);display:inline-block}
.b.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}.b.c{background:var(--c);border-color:var(--c);color:#fff}.b.sel{outline:2.5px solid var(--ink);outline-offset:1px}
.b:disabled{opacity:.4}
table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}td,th{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12.5px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:150px;padding:9px 0;border-radius:14px;font-size:13px;font-weight:600;color:var(--mut)}nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:5;padding:calc(14px + env(safe-area-inset-top)) 16px 60px}
.sheet>div{max-width:680px;margin:0 auto}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
label{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 3px;font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=time],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
textarea{min-height:84px;resize:vertical}
input[type=range]{width:100%}
.q{font:500 21px/1.35 var(--serif);margin:10px 0 14px}
.fb{padding:10px 12px;border-radius:12px;margin:10px 0;font-weight:600}.fb.y{background:color-mix(in srgb,var(--ok) 16%,transparent)}.fb.n{background:color-mix(in srgb,#d64545 14%,transparent)}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--soft);color:var(--mut)}.tag.g{background:#d8f0e2;color:#1d6b42}.tag.y{background:#fbecc4;color:#8a5a00}.tag.r{background:#f8d7d7;color:#9b2c2c}
.mut{color:var(--mut);font-size:13.5px}.big{font:600 44px var(--serif);text-align:center;margin:8px 0}
.al{display:flex;gap:12px;align-items:flex-start;cursor:pointer}.al>span:first-child{font-size:22px}
code{background:var(--soft);border-radius:6px;padding:1px 5px;font-size:13px}
pre{background:var(--soft);border-radius:12px;padding:10px;white-space:pre-wrap;font-size:13px}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90%}
</style>
</head>
<body>
<div id="app"></div>
<script src="core.js"></script>
<script src="german.js"></script>
<script src="app.js"></script>
</body>
</html>
